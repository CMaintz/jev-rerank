[project]
name = "jev-rerank"
version = "0.1.0"
description = "Fast, near-free RAG relevance filtering and reranking powered by TypeSafe AI's Jev."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Christoffer Maintz" }]
requires-python = ">=3.10"
dependencies = []
keywords = ["jev", "typesafe", "rag", "rerank", "reranker", "retrieval", "llm", "semantic-search"]

[project.urls]
Homepage = "https://github.com/CMaintz/jev-rerank"
Issues = "https://github.com/CMaintz/jev-rerank/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jev_rerank"]

[tool.ruff]
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
strict = true
files = ["src", "tests"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.coverage.run]
source = ["jev_rerank"]

[tool.coverage.report]
omit = ["src/jev_rerank/provider.py"]
