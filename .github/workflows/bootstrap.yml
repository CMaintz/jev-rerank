name: bootstrap
on:
  workflow_dispatch: {}
  schedule:
    - cron: '0 6 * * 1' # weekly auto-prune of the snooze baseline
jobs:
  bootstrap:
    uses: CMaintz/foundry/.github/workflows/bootstrap.yml@v1.2.0
    with:
      working_directory: '.'
      # No habit-hooks-python plugin ships yet, so structural smells come from the
      # language-independent generic sensor (jscpd + line-count). See .habit-hooks/config.toml.
      habit_hooks_plugin: 'habit-hooks-generic'
    permissions: { contents: write, pull-requests: write }
